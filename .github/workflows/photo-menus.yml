name: Menu from photos

# For a restaurant whose menu is only posted as pictures: reads the photos with Gemini,
# adds the dishes to that town's sheet, loads it into the live app and saves the sheet.
on:
  workflow_dispatch:
    inputs:
      town:
        description: "Town sheet (file name in tools/menus/handoffs, e.g. hartford)"
        required: true
      place:
        description: "Restaurant name"
        required: true
      address:
        description: "Street address with town"
        required: true
      cuisine:
        description: "Cuisine (e.g. mexican)"
        default: ""
      source:
        description: "Page the photos came from"
        default: ""
      urls:
        description: "Photo links, separated by spaces or new lines (empty: use the place's Google photos)"
        default: ""

permissions:
  contents: write

concurrency:
  group: hand-menus
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/menus
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS: sa.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Google photos
        if: github.event.inputs.urls == ''
        env:
          MAPS_API_KEY: ${{ secrets.PLACES_SERVER_KEY }}
          PLACE: ${{ github.event.inputs.place }}
          ADDRESS: ${{ github.event.inputs.address }}
        run: |
          node google-photos.mjs "$PLACE" "$ADDRESS" 10 > photos.txt
          { echo "URLS<<EOF"; cat photos.txt; echo "EOF"; } >> "$GITHUB_ENV"
      - name: Read the photos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLACE: ${{ github.event.inputs.place }}
          ADDRESS: ${{ github.event.inputs.address }}
          CUISINE: ${{ github.event.inputs.cuisine }}
          SOURCE: ${{ github.event.inputs.source }}
          URLS: ${{ github.event.inputs.urls || env.URLS }}
          TOWN: ${{ github.event.inputs.town }}
        run: node photo-menu.mjs "handoffs/$TOWN.jsonl"
      - name: Load the town
        env:
          TOWN: ${{ github.event.inputs.town }}
        run: |
          echo "$SA" > sa.json
          npm install --no-audit --no-fund
          node import-sheet.mjs "handoffs/$TOWN.jsonl" "hand-$TOWN.json"
          MAX_POSTS=3 node sync-firestore.mjs "hand-$TOWN.json"
          node stray-places.mjs "hand-$TOWN.json"
          rm -f sa.json
      - name: Save the sheet
        env:
          TOWN: ${{ github.event.inputs.town }}
          PLACE: ${{ github.event.inputs.place }}
        run: |
          git config user.name "Dishcover menus"
          git config user.email "menus@godishcover.com"
          git add "handoffs/$TOWN.jsonl"
          git commit -m "Menu from photos: $PLACE"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
