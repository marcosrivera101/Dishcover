name: Hand-gathered menus

# Town sheets gathered by hand (Muse, Grok) land in tools/menus/handoffs/<town>.jsonl.
# Pushing one loads it into the live app; the dispatch reloads them all.
on:
  push:
    branches: [main]
    paths: ["tools/menus/handoffs/**", "tools/menus/import-sheet.mjs", "tools/menus/stray-places.mjs"]
  workflow_dispatch:
    inputs:
      seed:
        description: "Also write this seed file as a place's whole menu (e.g. fixes/first-and-last.json)"
        default: ""

permissions:
  contents: read

concurrency:
  group: hand-menus
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/menus
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Load town sheets
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
        run: |
          if [ -z "$SA" ]; then echo "No FIREBASE_SERVICE_ACCOUNT secret."; exit 1; fi
          echo "$SA" > sa.json
          npm install --no-audit --no-fund
          if [ "${{ github.event_name }}" = "push" ] && ! git diff --name-only HEAD~1 HEAD | grep -E '^tools/menus/[^/]+\.mjs$' -q; then
            files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- handoffs | sed 's#tools/menus/##')
          else
            files=$(ls handoffs/*.jsonl)
          fi
          for f in $files; do
            town=$(basename "$f" .jsonl)
            echo "::group::$town"
            if node import-sheet.mjs "$f" "hand-$town.json"; then MAX_POSTS=15 node sync-firestore.mjs "hand-$town.json"; else echo "::warning::$town not loaded"; rm -f "hand-$town.json"; failed=1; fi
            echo "::endgroup::"
          done
          if [ -n "${{ github.event.inputs.seed }}" ]; then MAX_POSTS=0 node sync-firestore.mjs "${{ github.event.inputs.seed }}"; fi
          shopt -s nullglob; node stray-places.mjs hand-*.json
          exit ${failed:-0}
      - name: Take out closed restaurants
        if: always()
        continue-on-error: true
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
          ONLY_NEW: "1"
          MAX_CHECKS: "400"
        run: test -f sa.json && node closed-check.mjs || true
      - name: Clean up
        if: always()
        run: rm -f sa.json
