name: Menu check

# Reads Hartford restaurants' menus from their own websites. Runs every morning, and when
# the menu reader changes. Results go to the test-builds release; with the Firebase service
# account secret set, new dishes also go into the live app and onto the feed.
on:
  schedule:
    - cron: "0 10 * * *"
  push:
    paths:
      - "tools/menus/**"
      - ".github/workflows/menus.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: menu-check
  cancel-in-progress: false

jobs:
  menus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: tools/menus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Get the last run's menus
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download test-builds -p hartford-menus.json -O previous.json || echo "no previous run"
      - name: Read menus
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node run.mjs --out hartford-menus.json --prev previous.json 2>&1 | tee menu-check.log
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: for f in hartford-menus.json menu-changes.json menu-check.log; do [ -s "$f" ] && gh release upload test-builds "$f" --clobber || true; done
      - name: Update the live app
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$SA" ]; then echo "No FIREBASE_SERVICE_ACCOUNT secret yet, so the live app is not updated."; exit 0; fi
          echo "$SA" > sa.json
          GOOGLE_APPLICATION_CREDENTIALS=sa.json node sync-firestore.mjs hartford-menus.json $( [ -s previous.json ] && echo menu-changes.json )
          GOOGLE_APPLICATION_CREDENTIALS=sa.json MAPS_API_KEY="$MAPS_API_KEY" ONLY_NEW=1 MAX_CHECKS=400 node closed-check.mjs || echo "::warning::closed check failed"
          rm -f sa.json
