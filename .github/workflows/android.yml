name: Build app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # The Firebase config: either committed at app/google-services.json or stored as the
      # GOOGLE_SERVICES_JSON repository secret. Without it the APK runs in demo mode.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "dishcover-${{ steps.version.outputs.name }}.apk"

      # A "Test build" release with the APK attached, so it can be downloaded straight to a phone.
      - name: Publish test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Newest test build: ${{ steps.version.outputs.name }} from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). On your Android phone, tap the .apk below, then open it and allow the install."
          gh release view test-builds >/dev/null 2>&1 || gh release create test-builds --prerelease --title "Dishcover test builds" --notes "$NOTES"
          cp dishcover-*.apk dishcover.apk
          gh release upload test-builds dishcover.apk --clobber
          gh release edit test-builds --notes "$NOTES"

      # Goes live on main once the FIREBASE_SERVICE_ACCOUNT secret exists: publishes the database
      # and storage rules, then offers the new build to phones through the in-app update.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish rules and the new build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        if: github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          (cd functions && npm ci)
          npx --yes firebase-tools@13 deploy --only firestore,storage --project godishcover --non-interactive
          (cd functions && node scripts/publish-release.js "../dishcover-${{ steps.version.outputs.name }}.apk" \
            "${{ steps.version.outputs.code }}" "${{ steps.version.outputs.name }}")
          rm -f "$RUNNER_TEMP/sa.json"

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  # Runs the app on an Android emulator, taps through it in demo mode, and attaches a
  # screenshot of every screen to the test build release.
  screens:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and walkthrough
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Walk through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w app.godishcover.test/androidx.test.runner.AndroidJUnitRunner | tee walkthrough.txt || true
            adb exec-out run-as app.godishcover tar c -C files shots > shots.tar || true
            tar xf shots.tar || true
            adb logcat -d -t 400 AndroidRuntime:E '*:S' > crash.txt || true
      - name: Attach screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=test-builds
          (cd shots 2>/dev/null && zip -q ../screens.zip *.png) || true
          gh release upload "$TAG" walkthrough.txt crash.txt screens.zip --clobber || gh release upload "$TAG" walkthrough.txt crash.txt --clobber || true
          cat walkthrough.txt || true
          grep -q "OK (1 test)" walkthrough.txt
